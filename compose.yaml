name: family-connect
x-core: &core
  image: family-connect-core:auth2
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 256m
  depends_on:
    control:
      condition: service_healthy
  environment: &environment
    IDENTITY_DIR: /identity
    TRUST_ROOT_FILE: /trust/root.pub
    CATALOG_CACHE: /cache/catalog.json
    BOOTSTRAP_URLS: http://172.29.92.2:8080/v1/network-state
    GATEWAY_NAME: gateway-lab
services:
  control:
    build:
      context: .
      dockerfile: Dockerfile.control
    image: family-connect-control:auth2
    restart: unless-stopped
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["./state-v2/control:/state:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/network-state', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      management: {}
      lab2:
        ipv4_address: 172.29.92.2
  gateway:
    <<: *core
    build:
      context: .
      dockerfile: Dockerfile.core
    volumes: ["./state-v2/gateway-lab:/identity:ro", "./state-v2/trust:/trust:ro", "./state-v2/cache-gateway-lab:/cache:rw"]
    command: [gateway, gateway-lab]
    networks:
      lab2:
        ipv4_address: 172.29.92.10
  relay-a:
    <<: *core
    volumes: ["./state-v2/relay-a:/identity:ro", "./state-v2/trust:/trust:ro", "./state-v2/cache-relay-a:/cache:rw"]
    command: [relay, relay-a]
    networks:
      lab2:
        ipv4_address: 172.29.92.11
  relay-b:
    <<: *core
    volumes: ["./state-v2/relay-b:/identity:ro", "./state-v2/trust:/trust:ro", "./state-v2/cache-relay-b:/cache:rw"]
    command: [relay, relay-b]
    networks:
      lab2:
        ipv4_address: 172.29.92.12
  client:
    <<: *core
    profiles: [test]
    restart: "no"
    volumes: ["./state-v2/client:/identity:ro", "./state-v2/trust:/trust:ro", "./state-v2/cache-client:/cache:rw"]
    command: [client]
    networks: [lab2]
  outsider:
    <<: *core
    profiles: [test]
    restart: "no"
    volumes: ["./state-v2/outsider:/identity:ro", "./state-v2/trust:/trust:ro", "./state-v2/cache-outsider:/cache:rw"]
    command: [probe-relay]
    networks: [lab2]
networks:
  management: {}
  lab2:
    internal: true
    ipam:
      config:
        - subnet: 172.29.92.0/24
