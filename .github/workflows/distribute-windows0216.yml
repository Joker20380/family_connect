name: Distribute accepted Windows 0.2.16 preview
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/distribute-windows0216.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned native acceptance
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json,urllib.request,os
          base='https://api.github.com/repos/Joker20380/family_connect'
          def get(path):
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              return json.load(urllib.request.urlopen(request,timeout=30))
          source='5ae821d3c91345df9a18691c0e3421d9789b3e67'
          run=get('/actions/runs/41439156032')
          assert run['head_sha']==source
          jobs=get('/actions/runs/41439156032/jobs')['jobs']
          assert all(next(j for j in jobs if j['name']==name)['conclusion']=='success' for name in ['windows','windows-compatibility'])
          artifact=get('/actions/artifacts/13138243140')
          assert artifact['workflow_run']['id']==41439156032 and not artifact['expired']
          assert artifact['digest']=='sha256:cccbbe7a2294cae924301437a806eb329137e95cb9df146dfa3eef7bbc5662af'
      - uses: actions/download-artifact@v4
        with:
          name: FamilyConnect-Windows-Installer-pilot-unsigned
          run-id: '41439156032'
          github-token: ${{ github.token }}
          path: accepted-windows
      - name: Verify exact installer and assemble preview
        shell: python
        run: |
          import pathlib,hashlib,json,shutil
          out=pathlib.Path('publish');out.mkdir()
          name='FamilyConnect-Setup-0.2.16-pilot-unsigned.exe'
          exe=pathlib.Path('accepted-windows')/name
          raw=exe.read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='491a731edbf80887122844bebcccb8741e701b03816202f9a9b77c77855e8a65' and len(raw)==49955605
          manifest=pathlib.Path('accepted-windows/SHA256SUMS').read_text(encoding='utf-8-sig')
          assert any(line.split()==[digest,name] for line in manifest.splitlines()), 'installer hash not in CI SHA256SUMS'
          (out/name).write_bytes(raw)
          for image in pathlib.Path('accepted-windows').glob('Windows-*.png'):
              shutil.copyfile(image,out/image.name)
          (out/'SHA256SUMS').write_text(digest+'  '+name+'\n')
          (out/'receipt.json').write_text(json.dumps(dict(version='0.2.16',channel='windows',source='5ae821d3c91345df9a18691c0e3421d9789b3e67',windows_ci=41439156032,artifact_zip_digest='sha256:cccbbe7a2294cae924301437a806eb329137e95cb9df146dfa3eef7bbc5662af',artifact=dict(file=name,size=len(raw),sha256=digest)),indent=2)+'\n')
          pathlib.Path('notes.md').write_text('Windows 0.2.16: explicit Amsterdam 1 / Amsterdam 2 selection for AWG and TCP. Windows native CI, installer/broker/URI/UI/upgrade and compatibility jobs passed; Android is qualified separately and is not released by this workflow. The installer still has no publisher signature.\n\nExisting 0.2.14 clients can update through Check for updates after the signed catalog is published. 0.2.12 or earlier need one manual transition. Preserve identity and application data when updating.\n')
      - name: Publish immutable Windows preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=Joker20380/family_connect
          tag=windows-v0.2.16
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing immutable release.' >&2
            exit 1
          fi
          gh release create "$tag" publish/* --repo "$repo" --target 5ae821d3c91345df9a18691c0e3421d9789b3e67 --prerelease --title 'Windows 0.2.16 preview — two Amsterdam choices' --notes-file notes.md
