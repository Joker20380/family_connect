name: Android Friends readiness wire contract
on:
  push:
    paths: ['clients/android/**', 'control/friends/**', 'deploy/friends/**', 'device_identity/**', 'scripts/package_friends_http.py', 'tests/**', '.github/workflows/readiness-contract.yml']
  pull_request:
    paths: ['clients/android/**', 'control/friends/**', 'deploy/friends/**', 'device_identity/**', 'scripts/package_friends_http.py', 'tests/**', '.github/workflows/readiness-contract.yml']
permissions:
  contents: read
jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r control/requirements.lock -r device_identity/requirements.lock
      - run: gradle -p clients/android/control-tests --no-daemon test goldenClasspath
      - name: Android bytes to real Python HTTP handler and Android response parser
        run: |
          export FC_ANDROID_GOLDEN_CLASSPATH="$(cat clients/android/control-tests/build/golden-classpath.txt)"
          python -m pytest -q tests/test_android_challenge_contract.py tests/test_friends_restricted.py tests/test_readiness_receipts.py
