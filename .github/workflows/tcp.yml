name: TCP pilot
on:
  push:
    paths: ['pilot/tcp/**', 'compose.tcp.yaml', 'clients/linux/*tcp*', 'clients/desktop/**', 'scripts/*tcp*', '.github/workflows/tcp.yml']
  pull_request:
    paths: ['pilot/tcp/**', 'compose.tcp.yaml', 'clients/linux/*tcp*', 'clients/desktop/**', 'scripts/*tcp*', '.github/workflows/tcp.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest cryptography
      - run: python -m pytest -q clients/desktop/tests
      - run: docker build -f pilot/tcp/Dockerfile -t family-connect-xray:26.3.27-pilot1 .
      - run: docker compose -f compose.tcp.yaml config --quiet
      - name: Verify TCP routing in an isolated network namespace
        run: >-
          docker run --rm --network none --user 0 --cap-add NET_ADMIN
          -v "$PWD/clients/linux:/fix:ro" -v "$PWD/clients/desktop:/desktop:ro"
          -v "$PWD/scripts:/checks:ro" --entrypoint python3
          family-connect-xray:26.3.27-pilot1 /checks/check_tcp_routes.py
      - name: Package standalone TCP updater setup
        run: |
          version=0.1.0
          if [[ "$GITHUB_REF" == refs/tags/tcp-setup-v* ]]; then version="${GITHUB_REF_NAME#tcp-setup-v}"; fi
          python3 scripts/package_tcp_setup.py --version "$version" --output "$RUNNER_TEMP/FamilyConnect-TCP-Setup.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-TCP-Setup-unsigned-pilot
          path: ${{ runner.temp }}/FamilyConnect-TCP-Setup.tar.gz
      - name: Package separate Linux TCP components
        run: |
          mkdir -p artifacts/tcp
          tcp_container=$(docker create family-connect-xray:26.3.27-pilot1)
          trap 'docker rm "$tcp_container" >/dev/null' EXIT
          docker cp "$tcp_container:/usr/local/bin/xray" "$RUNNER_TEMP/xray"
          python3 scripts/package_tcp.py --xray "$RUNNER_TEMP/xray" --output artifacts/tcp/FamilyConnect-TCP-amd64.tar.gz
      - name: Verify isolated component install and rollback (systemd stub)
        run: >-
          docker run --rm --network none --user 0 --device /dev/net/tun
          -v "$PWD/artifacts/tcp/FamilyConnect-TCP-amd64.tar.gz:/bundle.tar.gz:ro"
          -v "$PWD/scripts:/checks:ro" --entrypoint python3
          family-connect-xray:26.3.27-pilot1 /checks/check_tcp_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-TCP-amd64-unsigned-pilot
          path: artifacts/tcp/FamilyConnect-TCP-amd64.tar.gz
# Live gateway checks are operator-run with a local 0600 profile; never a CI secret.

  release:
    if: startsWith(github.ref, 'refs/tags/tcp-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FamilyConnect-TCP-amd64-unsigned-pilot
          path: component
      - name: Publish immutable TCP pilot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#tcp-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          name="FamilyConnect-TCP-amd64-$version.tar.gz"
          mv component/FamilyConnect-TCP-amd64.tar.gz "component/$name"
          (cd component && sha256sum "$name" > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "component/$name" component/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "Family Connect TCP $version (Linux amd64 pilot)" --notes "Separate Linux TCP component. Operator pilot only; no automatic VPN start. Signed catalog is published separately after download and installation acceptance. Desktop releases remain separate."

  setup_release:
    if: startsWith(github.ref, 'refs/tags/tcp-setup-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FamilyConnect-TCP-Setup-unsigned-pilot
          path: setup
      - name: Publish immutable standalone TCP Setup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#tcp-setup-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          name="FamilyConnect-TCP-Setup-$version.tar.gz"
          mv setup/FamilyConnect-TCP-Setup.tar.gz "setup/$name"
          (cd setup && sha256sum "$name" > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "setup/$name" setup/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "Family Connect TCP Setup $version (Linux amd64 pilot)" --notes "Standalone root updater bootstrap, no Git checkout required on the target. Does not start VPN or include profiles. Authenticate the archive with the separately published offline signature and a previously trusted key BEFORE administrator execution. See docs/tcp-setup-trust.ru.md in the repository. Desktop and TCP component releases remain separate."
