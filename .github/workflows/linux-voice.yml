name: Linux voice and encrypted messaging
on:
  workflow_dispatch:
  push:
    paths: ['clients/desktop/**', 'clients/shared/**', 'provisioning/chat_*.py', 'messenger/**', 'tests/test_linux_chat*', 'tests/test_messenger_reference.py', '.github/workflows/linux-voice.yml']
  pull_request:
    paths: ['clients/desktop/**', 'clients/shared/**', 'provisioning/chat_*.py', 'messenger/**', 'tests/test_linux_chat*', 'tests/test_messenger_reference.py', '.github/workflows/linux-voice.yml']
permissions:
  contents: read
jobs:
  linux-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install system runtime
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libcodec2-1.2 libxtst6 xvfb dbus-x11
      - name: Isolated Python dependencies
        run: |
          /usr/bin/python3 -m venv --system-site-packages /tmp/fc-voice-env
          /tmp/fc-voice-env/bin/pip install pytest==9.1.1 -r provisioning/requirements.lock
          /tmp/fc-voice-env/bin/pip install --no-deps --require-hashes -r messenger/requirements.lock
      - name: Actual codec and mailbox gates
        env:
          FC_TEST_LINUX_AUDIO: '1'
        run: /tmp/fc-voice-env/bin/python -m pytest -q tests/test_linux_chat_audio.py tests/test_linux_chat_events.py messenger/tests/test_linux_owner.py messenger/tests/test_linux_mailbox.py messenger/tests/test_announcements.py messenger/tests/test_chat_rpc.py messenger/tests/test_chat_client.py clients/desktop/tests/test_chat_service.py tests/test_messenger_reference.py tests/test_linux_chat_package.py
      - name: Real GTK with synthetic microphone and silent output
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
          GSETTINGS_BACKEND: memory
          PYTHONPATH: .
        run: |
          for scale in 1 1.25 1.5 2; do
            export GDK_SCALE=1
            if [ "$scale" = 2 ]; then export GDK_SCALE=2; fi
            dbus-run-session --config-file=clients/desktop/tests/dbus-isolated.conf -- xvfb-run -a -s '-screen 0 1920x2400x24' /tmp/fc-voice-env/bin/python clients/desktop/chat_voice_check.py "$RUNNER_TEMP/voice-$scale" "$scale"
            dbus-run-session --config-file=clients/desktop/tests/dbus-isolated.conf -- xvfb-run -a -s '-screen 0 1920x2400x24' /tmp/fc-voice-env/bin/python clients/desktop/chat_notifications_check.py "$RUNNER_TEMP/notices-$scale" "$scale"
            dbus-run-session --config-file=clients/desktop/tests/dbus-isolated.conf -- xvfb-run -a -s '-screen 0 1920x2400x24' /tmp/fc-voice-env/bin/python clients/desktop/chat_announcements_check.py "$RUNNER_TEMP/announcements-$scale" "$scale"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-voice-gtk-evidence
          path: |
            ${{ runner.temp }}/voice-*/*.png
            ${{ runner.temp }}/voice-*/result.json
            ${{ runner.temp }}/voice-*/pointer-events.json
            ${{ runner.temp }}/notices-*/*.png
            ${{ runner.temp }}/notices-*/result.json
            ${{ runner.temp }}/announcements-*/*.png
            ${{ runner.temp }}/announcements-*/result.json
