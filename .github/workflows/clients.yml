name: Client builds
on:
  push:
    paths: ['clients/**', '.github/workflows/clients.yml']
  pull_request:
    paths: ['clients/**', '.github/workflows/clients.yml']
  workflow_dispatch:
concurrency:
  group: family-connect-clients-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: clients/android
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-Android-debug
          path: clients/android/app/build/outputs/apk/debug/*.apk
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./clients/windows/build.ps1
      - name: Defender scan when available
        shell: pwsh
        run: ./clients/windows/scan.ps1
      - name: Install application and service
        shell: pwsh
        run: ./clients/windows/test-install.ps1 -Stage Install
      - name: Load signed driver without routes
        shell: pwsh
        timeout-minutes: 2
        run: ./clients/windows/verify-driver.ps1
      - name: Check broker activation API
        shell: pwsh
        run: ./clients/windows/test-install.ps1 -Stage Broker
      - name: Check user interface
        shell: pwsh
        run: ./clients/windows/test-install.ps1 -Stage UI
      - name: Uninstall application and service
        if: always()
        shell: pwsh
        run: ./clients/windows/test-install.ps1 -Stage Uninstall
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-Windows-Installer-pilot-unsigned
          path: clients/windows/dist/
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest clients/desktop/tests -q
      - run: xvfb-run -a /usr/bin/python3 clients/desktop/app.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-Linux
          path: |
            clients/desktop/*.py
            clients/desktop/*.sh
