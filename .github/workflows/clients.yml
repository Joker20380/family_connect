name: Client builds
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['clients/**', '.github/workflows/clients.yml', 'scripts/package_desktop.py', 'VERSION', 'pilot/windows-tcp/build.ps1', 'pilot/windows-awg/**', 'pilot/android-awg/**', 'pilot/android-tcp/**']
  pull_request:
    paths: ['clients/**', '.github/workflows/clients.yml', 'scripts/package_desktop.py', 'VERSION', 'pilot/windows-tcp/build.ps1', 'pilot/windows-awg/**', 'pilot/android-awg/**', 'pilot/android-tcp/**']
  workflow_dispatch:
concurrency:
  group: family-connect-clients-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build pinned Android AWG library
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" python3 -u pilot/android-awg/build.py 2>&1 | tee android-awg-build.log
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: clients/android
      - run: python3 pilot/android-awg/verify-apk.py
      - run: python3 -m pip install cryptography==46.0.7
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real WG AWG encrypted data lifecycle on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 -u pilot/android-awg/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FamilyConnect-Android-debug
          path: |
            clients/android/app/build/outputs/apk/debug/*.apk
            clients/android/awg-generated/assets/awg-build.json
            clients/android/app/build/test-results/testDebugUnitTest/*.xml
            clients/android/app/build/outputs/androidTest-results/connected/**/*.xml
            clients/android/app/build/reports/lint-results-debug.txt
            android-awg-*.log
            android-awg-apk.json
            android-tcp-*.log
            android-tcp-peer-result.json
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force clients/windows/dist | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE 'clients/windows/dist/build-check.txt'
          ./clients/windows/build.ps1 *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Defender scan when available
        shell: pwsh
        run: ./clients/windows/scan.ps1
      - name: Install application and service
        shell: pwsh
        run: ./clients/windows/test-install.ps1 -Stage Install
      - name: Load signed driver without routes
        shell: pwsh
        timeout-minutes: 2
        run: ./clients/windows/verify-driver.ps1
      - name: Check broker activation API
        shell: pwsh
        run: ./clients/windows/test-install.ps1 -Stage Broker
      - name: Check TCP profile broker storage and replacement
        shell: pwsh
        run: dotnet run --project clients/windows/BrokerTests/BrokerTests.csproj -c Release -- clients/windows/dist/tcp-broker-check.txt
      - name: Check user interface
        shell: pwsh
        run: ./clients/windows/test-install.ps1 -Stage UI
      - name: Check compact and scaled window layouts
        shell: pwsh
        run: |
          $app = Get-ChildItem clients/windows -Filter FamilyConnect.exe -Recurse | Where-Object { $_.FullName -notmatch '[\\/]obj[\\/]' } | Select-Object -First 1
          if (-not $app) { throw "Application executable missing" }
          $process = Start-Process $app.FullName -ArgumentList '/layout-test' -PassThru
          if (-not $process.WaitForExit(200000)) { $process.Kill(); throw 'Layout checks timed out' }
          if (Test-Path "$env:TEMP/fc-layout-check.txt") { $failure = (Get-Content "$env:TEMP/fc-layout-check.txt" -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'); Write-Output "::error title=Layout detail::$failure" }
          if (Test-Path "$env:TEMP/Windows-preview.png") { $preview = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:TEMP/Windows-preview.png")); Write-Output "::notice title=Windows preview::$preview" }
          if ($process.ExitCode -ne 0) { Get-Content "$env:TEMP/fc-layout-check.txt" -ErrorAction SilentlyContinue; throw "Layout checks failed: $($process.ExitCode)" }
      - name: Save Windows UI preview
        shell: pwsh
        run: Copy-Item "$env:TEMP/Windows-preview.png" clients/windows/dist/
      - name: Uninstall application and service
        if: always()
        shell: pwsh
        run: ./clients/windows/test-install.ps1 -Stage Uninstall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FamilyConnect-Windows-Installer-pilot-unsigned
          path: clients/windows/dist/
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-cryptography xvfb dbus-x11
      - run: python -m pip install pytest==9.1.1 cryptography==46.0.7
      - run: python -m pytest clients/desktop/tests -q
      - run: GSK_RENDERER=cairo GTK_A11Y=none dbus-run-session -- xvfb-run -a /usr/bin/python3 clients/desktop/app.py --smoke
      - run: GSK_RENDERER=cairo GTK_A11Y=none dbus-run-session -- xvfb-run -a -s "-screen 0 2560x2160x24" /usr/bin/python3 clients/desktop/layout_check.py
      - run: GSK_RENDERER=cairo GTK_A11Y=none dbus-run-session -- xvfb-run -a /usr/bin/python3 clients/desktop/recovery_check.py
      - run: GSK_RENDERER=cairo GTK_A11Y=none dbus-run-session -- xvfb-run -a /usr/bin/python3 clients/desktop/tcp_install_check.py
      - run: python3 scripts/package_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-Linux
          path: |
            clients/desktop/*.py
            clients/desktop/*.sh
            artifacts/clients/FamilyConnect-Linux-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release '))
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FamilyConnect-Windows-Installer-pilot-unsigned
          path: release-windows
      - uses: actions/download-artifact@v4
        with:
          name: FamilyConnect-Linux
          path: release-linux
      - name: Prepare versioned release files
        run: |
          python3 scripts/package_desktop.py --release-files
          cp release-windows/Windows-preview.png release-files/
      - name: Publish tested pilot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          gh release create "v$version" release-files/* --target "$GITHUB_SHA" --prerelease --title "Family Connect v$version" --notes-file "docs/releases/$version.en.md"
