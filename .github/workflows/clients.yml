name: Client builds
on:
  push:
    paths: ['clients/**', '.github/workflows/clients.yml']
  pull_request:
    paths: ['clients/**', '.github/workflows/clients.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: clients/android
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-Android-debug
          path: clients/android/app/build/outputs/apk/debug/*.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./clients/windows/build.ps1
      - name: Defender scan when available
        shell: pwsh
        run: ./clients/windows/scan.ps1
      - name: Install and check broker without connecting VPN
        shell: pwsh
        run: |
          $installer = Resolve-Path clients/windows/dist/*pilot-unsigned.exe
          $p = Start-Process $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { $tail=(Get-Content install.log -Tail 12) -join '%0A'; Write-Host "::error::Installation failed: $($p.ExitCode) $tail"; throw 'Installation failed' }
          ./clients/windows/verify-driver.ps1
          $app = "$env:ProgramFiles/Family Connect/FamilyConnect.exe"
          $p = Start-Process $app -ArgumentList '/broker-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { $detail=Get-Content "$env:TEMP/fc-broker-check.txt" -ErrorAction SilentlyContinue; Write-Host "::error::Broker check failed: $($p.ExitCode) $detail"; throw "Broker check failed" }
          $p = Start-Process $app -ArgumentList '/smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'UI smoke failed' }
          $p = Start-Process "$env:ProgramFiles/Family Connect/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Get-Service FamilyConnectBroker -ErrorAction SilentlyContinue) { throw 'Broker left behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-Windows-Installer-pilot-unsigned
          path: clients/windows/dist/
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest clients/desktop/tests -q
      - run: xvfb-run -a /usr/bin/python3 clients/desktop/app.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-Linux
          path: |
            clients/desktop/*.py
            clients/desktop/*.sh
