name: Windows AWG native pilot
on:
  push:
    paths: ['pilot/windows-awg/**', 'clients/windows/*.cs', 'clients/windows/*.ps1', 'clients/windows/Core/**', '.github/workflows/windows-awg.yml']
  pull_request:
    paths: ['pilot/windows-awg/**', 'clients/windows/*.cs', 'clients/windows/*.ps1', 'clients/windows/Core/**', '.github/workflows/windows-awg.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build pinned AWG worker and synthetic peer
        shell: pwsh
        run: |
          ./pilot/windows-awg/build.ps1 -Output "$env:RUNNER_TEMP/fc-windows-awg" *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/awg-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build isolated owner using broker job primitive
        shell: pwsh
        run: |
          dotnet publish pilot/windows-awg/owner/Host.csproj -c Release -r win-x64 --self-contained false -o "$env:RUNNER_TEMP/fc-awg-owner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual AWG 2 IPv4 IPv6 data rejection and owner-crash cleanup
        timeout-minutes: 8
        shell: pwsh
        run: |
          python -m pip install cryptography==46.0.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python pilot/windows-awg/check.py "$env:RUNNER_TEMP/fc-windows-awg" "$env:RUNNER_TEMP/fc-awg-owner/Host.exe" "$env:RUNNER_TEMP/awg-acceptance.json" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/awg-acceptance.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual broker for scoped AWG session
        shell: pwsh
        run: |
          dotnet publish pilot/windows-tcp/broker/SessionHost.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/fc-awg-broker"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/fc-awg-broker/awg" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/fc-windows-awg/fc-awg.exe","$env:RUNNER_TEMP/fc-windows-awg/wintun.dll" "$env:RUNNER_TEMP/fc-awg-broker/awg/"
      - name: Build pinned TCP peer for automatic transport acceptance
        shell: pwsh
        run: |
          ./pilot/windows-tcp/build.ps1 -Output "$env:RUNNER_TEMP/fc-auto-tcp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/fc-awg-broker/tcp" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/fc-auto-tcp/xray.exe","$env:RUNNER_TEMP/fc-auto-tcp/wintun.dll" "$env:RUNNER_TEMP/fc-awg-broker/tcp/"
      - name: Signed AWG activation and actual LocalSystem data cleanup
        shell: pwsh
        timeout-minutes: 14
        run: |
          python pilot/windows-awg/broker_check.py "$env:RUNNER_TEMP/fc-awg-broker" "$env:RUNNER_TEMP/fc-windows-awg" "$env:RUNNER_TEMP/awg-broker-result.json" "$env:RUNNER_TEMP/fc-auto-tcp" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/awg-broker.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove isolated AWG broker
        if: always()
        shell: pwsh
        run: |
          $exe="$env:RUNNER_TEMP/fc-awg-broker/FamilyConnect.exe"
          if(Test-Path $exe){& $exe /remove-service}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FamilyConnect-Windows-AWG-engine-preview
          path: |
            ${{ runner.temp }}/fc-windows-awg/
            ${{ runner.temp }}/awg-build.log
            ${{ runner.temp }}/awg-acceptance.*
            ${{ runner.temp }}/awg-broker*
            ${{ runner.temp }}/fc-awg-broker/*error.txt
