name: Control panel
on:
  workflow_dispatch:
    inputs:
      support_candidate:
        description: 'Qualify support contracts and build a separate unsigned Android candidate; no VPN/G4 rerun or deployment'
        type: boolean
        default: false
  push:
    paths: ['control_plane/**', 'messenger/**', 'provisioning/support_worker.py', 'control/friends/support.py', '.github/workflows/control-panel.yml']
  pull_request:
    paths: ['control_plane/**', 'messenger/**', 'provisioning/support_worker.py', 'control/friends/support.py', '.github/workflows/control-panel.yml']
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
env:
  SUPPORT_SOURCE_SHA: ${{ github.event_name == 'pull_request_review' && github.event.pull_request.head.sha || github.sha }}
jobs:
  support-contracts:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.support_candidate) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'commented' &&
       (github.event.review.body == '/qualify-support-candidate' || github.event.review.body == '/qualify-support-runtime') &&
       github.event.review.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUPPORT_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r control/requirements.lock -r provisioning/requirements.lock -r device_identity/requirements.lock
      - run: python -m pip install --no-deps --require-hashes -r messenger/requirements.lock
      - name: Existing messenger and addressed support contracts
        run: >-
          python -m pytest -q messenger/tests tests/test_friends_chat.py tests/test_chat_service_sender.py
          tests/test_support_binding.py tests/test_support_collector.py
          tests/test_support_http.py tests/test_support_package.py tests/test_support_upgrade.py
          tests/test_android_public_release.py
      - name: Closed commissioning kit
        run: python -m scripts.package_support_chat --output artifacts/support-chat-kit
      - uses: actions/upload-artifact@v4
        with:
          name: support-chat-commissioning-kit
          path: artifacts/support-chat-kit.tar.gz
          if-no-files-found: error
  support-android:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.support_candidate) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'commented' &&
       github.event.review.body == '/qualify-support-candidate' &&
       github.event.review.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUPPORT_SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build unchanged pinned native dependencies, without transport suites
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" python3 pilot/android-awg/build.py --abi arm64-v8a
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y cmake ninja-build
          fi
          cmake --version
          ninja --version
          git clone --quiet https://github.com/drowe67/codec2 "$RUNNER_TEMP/android-codec2"
          git -C "$RUNNER_TEMP/android-codec2" checkout --detach 06d4c11e699b0351765f10398abb4f663a984f36
          python3 clients/android/audio/build.py --source "$RUNNER_TEMP/android-codec2" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --out clients/android/audio-generated --abi arm64-v8a
          git clone --quiet https://github.com/XTLS/Xray-core "$RUNNER_TEMP/restricted-xray"
          git -C "$RUNNER_TEMP/restricted-xray" checkout --detach d2758a023cd7f4174a5a5fa4ff66e487d4342ba0
          python3 pilot/android-restricted/build.py --xray "$RUNNER_TEMP/restricted-xray" --go "$(command -v go)" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --out "$GITHUB_WORKSPACE/clients/android/restricted-generated"
      - name: Candidate APK, JVM checks, lint and actual runtime-test compilation
        working-directory: clients/android
        run: >-
          gradle --no-daemon -PfcTargetAbi=arm64-v8a -PfcFriendsCi=false
          :app:assembleFriends :app:testFriendsUnitTest :app:lintFriends :app:assembleDebugAndroidTest
      - name: Verify unsigned source-bound ARM64 payload
        run: |
          python3 -m pip install cryptography==46.0.7
          python3 pilot/android-restricted/package_ci.py --source-commit "$SUPPORT_SOURCE_SHA" --out restricted-release --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --android-only
      - uses: actions/upload-artifact@v4
        with:
          name: support-chat-Android125-unsigned-arm64
          path: |
            restricted-release/
            clients/android/audio-generated/corresponding-source/
            clients/android/audio-generated/audio-build.json
          if-no-files-found: error
  panel:
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.state == 'commented' &&
       (github.event.review.body == '/qualify-support-candidate' || github.event.review.body == '/qualify-system-messages' || github.event.review.body == '/qualify-support-runtime') &&
       github.event.review.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: fc_control_plane
          POSTGRES_DB: fc_control_plane
          POSTGRES_PASSWORD: synthetic-ci-panel-password-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
    env:
      CONTROL_PLANE_MODE: synthetic
      DJANGO_SECRET_KEY: synthetic-ci-panel-key-not-for-installation-000000000000
      POSTGRES_PASSWORD: synthetic-ci-panel-password-only
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUPPORT_SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r control_plane/requirements.lock
      - name: Source-only support worker integration dependencies
        run: pip install --no-deps --require-hashes -r messenger/requirements.lock
      - name: Migrations and console/fleet regression
        working-directory: control_plane
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m pytest -q tests
      - name: Browser form request identity and network-loss retry
        run: node --test control_plane/tests/support_form.test.cjs
      - name: External system publisher deployment boundary
        run: python -m pytest -q tests/test_system_message_deployment.py
      - name: Build the actual allowlisted panel
        run: |
          python control_plane/prepare_local.py
          docker build -t fc-panel-ci control_plane/.local/build-context
          docker run --rm --env-file control_plane/.env fc-panel-ci python manage.py check
