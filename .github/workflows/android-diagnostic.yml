name: Android diagnostic acceptance
on:
  push:
    paths: ['.github/workflows/android-diagnostic.yml', 'pilot/android-awg/report_ci.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build pinned unified Android VPN library
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" python3 -u pilot/android-awg/build.py 2>&1 | tee android-awg-build.log
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: clients/android
      - run: python3 pilot/android-awg/verify-apk.py
      - run: python3 -m pip install cryptography==46.0.7
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real WG AWG TCP and Auto lifecycle on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 -u pilot/android-awg/run.py
      - name: Publish bounded runtime test summary
        if: always()
        run: python3 pilot/android-awg/report_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FamilyConnect-Android-debug
          path: |
            clients/android/app/build/outputs/apk/debug/*.apk
            clients/android/awg-generated/assets/awg-build.json
            clients/android/app/build/test-results/testDebugUnitTest/*.xml
            clients/android/app/build/outputs/androidTest-results/connected/**/*.xml
            clients/android/app/build/reports/lint-results-debug.txt
            android-awg-*.log
            android-awg-apk.json
            android-tcp-*.log
            android-tcp-peer-result.json
            android-ci-summary.json
