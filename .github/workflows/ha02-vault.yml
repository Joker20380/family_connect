name: HA-02 purpose-separated vault consumer
on:
  push:
    paths: ['scripts/ha_wrapping_key.py', 'scripts/signing_key.py', 'tests/test_ha_wrapping_key.py', 'tests/test_signing_key.py', '.github/workflows/ha02-vault.yml']
  pull_request:
    paths: ['scripts/ha_wrapping_key.py', 'scripts/signing_key.py', 'tests/test_ha_wrapping_key.py', 'tests/test_signing_key.py', '.github/workflows/ha02-vault.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y keepassxc
      - run: python -m pip install -r control/requirements.lock -r device_identity/requirements.lock
      - run: python -m pytest -q tests/test_ha_wrapping_key.py tests/test_signing_key.py --junitxml="$RUNNER_TEMP/ha-vault.xml"
      - name: Require native cases and exact source
        if: always()
        run: |
          python - <<'PY'
          import json, os, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          cases = list(ET.parse(root / 'ha-vault.xml').iter('testcase'))
          assert cases and all(not any(case.find(kind) is not None for kind in ('skipped', 'failure', 'error')) for case in cases)
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          (root / 'ha-vault-receipt.json').write_text(json.dumps(dict(source=source, tests=len(cases), skips=0, fixture_only=True, production_vault_opened=False)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha02-vault-qualification
          path: |
            ${{ runner.temp }}/ha-vault.xml
            ${{ runner.temp }}/ha-vault-receipt.json
          if-no-files-found: error
