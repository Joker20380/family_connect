name: Windows control conformance
on:
  push:
    paths: ['clients/windows/Core/**', 'clients/windows/Tests/**', 'tests/vectors/**', '.github/workflows/windows-control.yml']
  pull_request:
    paths: ['clients/windows/Core/**', 'clients/windows/Tests/**', 'tests/vectors/**', '.github/workflows/windows-control.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native verifier and legacy protocol regression
        run: dotnet run --project clients/windows/Tests/Tests.csproj -c Release
