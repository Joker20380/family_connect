name: Messenger prototype
on:
  workflow_dispatch:
    inputs:
      android_chat_runtime:
        description: 'Build the isolated chat test APK and run emulator acceptance'
        type: boolean
        default: false
  push:
    paths: ['messenger/**', 'provisioning/requirements.lock', '.github/workflows/messenger.yml', 'clients/android/chat-runtime/**', 'clients/android/chat-python.gradle', 'clients/android/chat-tests/**', 'clients/android/app/src/main/python/**', 'clients/android/app/src/main/java/com/familyconnect/app/Chat*.java', 'clients/android/app/src/main/java/com/familyconnect/app/PythonRuntimeAndroid.java']
  pull_request:
    paths: ['messenger/**', 'provisioning/requirements.lock', '.github/workflows/messenger.yml', 'clients/android/chat-runtime/**', 'clients/android/chat-python.gradle', 'clients/android/chat-tests/**', 'clients/android/app/src/main/python/**', 'clients/android/app/src/main/java/com/familyconnect/app/Chat*.java', 'clients/android/app/src/main/java/com/familyconnect/app/PythonRuntimeAndroid.java']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r control/requirements.lock -r provisioning/requirements.lock
      - run: python -m pip install --no-deps --require-hashes -r messenger/requirements.lock
      - run: python -m pytest -q messenger/tests
  android-local:
    # Separate test harness; explicit manual opt-in, not a consumer release.
    if: github.event_name == 'workflow_dispatch' && inputs.android_chat_runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Cross-language AES-GCM checks
        run: |
          javac -encoding UTF-8 -d /tmp/chat-cipher clients/android/app/src/main/java/com/familyconnect/app/ChatStoreCipher.java clients/android/chat-tests/ChatCipherChecks.java
          java -cp /tmp/chat-cipher com.familyconnect.app.ChatCipherChecks
      - run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
        working-directory: clients/android/chat-runtime
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keystore, JNI and process restart acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 clients/android/chat-runtime/run.py
# Synthetic identities only. APK is an isolated test harness, never a release asset.
