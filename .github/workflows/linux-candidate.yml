name: Linux internal candidate
on:
  push:
    branches: ['**']
    paths: ['clients/desktop/**', 'provisioning/**', 'messenger/**', 'device_identity/**', 'packaging/**', 'scripts/package_linux.py', 'scripts/linux_candidate.py', 'scripts/verify_linux_candidate.py', 'scripts/ci_linux_candidate.sh', 'tests/fixtures/linux_candidate/**', '.github/workflows/linux-candidate.yml']
  pull_request:
    paths: ['clients/desktop/**', 'provisioning/**', 'messenger/**', 'device_identity/**', 'packaging/**', 'scripts/package_linux.py', 'scripts/linux_candidate.py', 'scripts/verify_linux_candidate.py', 'scripts/ci_linux_candidate.sh', 'tests/fixtures/linux_candidate/**', '.github/workflows/linux-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare supported Python and real GI imports
        run: |
          bash scripts/ci_desktop_env.sh "$RUNNER_TEMP/fc-candidate-env"
          echo "$RUNNER_TEMP/fc-candidate-env/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: clients/mesh/go.sum
      - name: Bounded candidate packaging and privilege regressions
        run: python -m pytest -q clients/desktop/tests/test_linux_candidate.py clients/desktop/tests/test_mesh_installer.py clients/desktop/tests/test_system_runtime.py tests/test_linux_chat_package.py
      - name: Standard accepted-source rebuild and real isolated package gates
        run: bash scripts/ci_linux_candidate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FamilyConnect-L03.2-internal
          retention-days: 7
          path: |
            artifacts/linux-candidate/*.log
            artifacts/linux-candidate/candidate-delivery.json
            artifacts/linux-candidate/FamilyConnect*.AppImage
            artifacts/linux-candidate/FamilyConnect*.deb
            artifacts/linux-candidate/FamilyConnect*.tar.gz
