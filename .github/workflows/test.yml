name: phase0
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r control/requirements.lock
      - run: python -m pytest -q
      - run: cargo test --manifest-path core/Cargo.toml --locked
  failover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: sudo ./scripts/provision.sh
      - run: ./scripts/test_failover.sh
      - run: ./scripts/test_auth.sh
      - run: ./scripts/test_offline.sh
      - run: python3 scripts/test_revocation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-failover
          path: artifacts/
      - run: docker compose down
        if: always()
