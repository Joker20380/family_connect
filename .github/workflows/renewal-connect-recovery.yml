name: Bounded renewal TCP recovery
on:
  push:
    paths: ['scripts/renewal_connect_recovery.py', 'deploy/friends/restricted/ssh-connect-bounded', 'tests/test_renewal_connect_recovery.py', 'tests/fixtures/renewal_connect_native.py', '.github/workflows/renewal-connect-recovery.yml']
  pull_request:
    paths: ['scripts/renewal_connect_recovery.py', 'deploy/friends/restricted/ssh-connect-bounded', 'tests/test_renewal_connect_recovery.py', 'tests/fixtures/renewal_connect_native.py', '.github/workflows/renewal-connect-recovery.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_renewal_connect_recovery.py --junitxml=connect.xml
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          sudo python3 tests/fixtures/renewal_connect_native.py > connect-native.json
          sudo install -m 755 deploy/friends/restricted/ssh-connect-bounded /usr/local/lib/fc-ssh-connect-lab
          sudo systemd-run --unit=fc-connect-namespace-lab --collect --wait --pipe \
            -p NoNewPrivileges=yes -p PrivateTmp=yes \
            -p Environment=FC_TEST_CONNECT_WRAPPER=1 \
            -p BindReadOnlyPaths=/usr/bin/ssh:/run/family-connect-ssh-original \
            -p BindReadOnlyPaths=/usr/local/lib/fc-ssh-connect-lab:/usr/bin/ssh \
            python3 "$PWD/tests/fixtures/renewal_connect_native.py" > connect-namespace.json
          git rev-parse HEAD > connect-source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renewal-connect-recovery
          path: |
            connect.xml
            connect-native.json
            connect-namespace.json
            connect-source.txt
          if-no-files-found: error
