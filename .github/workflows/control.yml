name: Linux control preview
on:
  push:
    paths: ['scripts/ci_release_fixtures.py', 'scripts/ci_python313_env.sh', 'control/requirements.lock', 'messenger/requirements.lock', 'control/friends/**', 'deploy/friends/**', 'scripts/package_restricted_runtime.py', 'scripts/package_friends_http.py', 'scripts/friends_http_acceptance.py', 'scripts/friends_http_transition.py', 'provisioning/**', 'device_identity/**', 'clients/desktop/**', 'scripts/package_control.py', 'scripts/run_control_preview.py', 'scripts/package_desktop.py', 'tests/**', '.github/workflows/control.yml', 'VERSION']
  pull_request:
    paths: ['scripts/ci_release_fixtures.py', 'scripts/ci_python313_env.sh', 'control/requirements.lock', 'messenger/requirements.lock', 'control/friends/**', 'deploy/friends/**', 'scripts/package_restricted_runtime.py', 'scripts/package_friends_http.py', 'scripts/friends_http_acceptance.py', 'scripts/friends_http_transition.py', 'provisioning/**', 'device_identity/**', 'clients/desktop/**', 'scripts/package_control.py', 'scripts/run_control_preview.py', 'scripts/package_desktop.py', 'tests/**', '.github/workflows/control.yml', 'VERSION']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Local HTTP contract proxy
        run: sudo apt-get update && sudo apt-get install -y nginx iproute2 keepassxc gcc pkg-config libcairo2-dev libgirepository1.0-dev gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Prepare Python 3.13 and verify real full-suite imports
        run: |
          bash scripts/ci_python313_env.sh "$RUNNER_TEMP/fc-python313-env"
          echo "FC_TEST_PYTHON=$RUNNER_TEMP/fc-python313-env/bin/python" >> "$GITHUB_ENV"
      - name: Targeted desktop dependency regressions
        run: '"$FC_TEST_PYTHON" -m pytest -q clients/desktop/tests/test_chat_host_registration.py clients/desktop/tests/test_mesh_chat_host.py clients/desktop/tests/test_support_service.py clients/desktop/tests/test_chat_service.py -ra --tb=short'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: carrier/go.sum
      - run: go mod download
        working-directory: carrier
      - name: Provision source-pinned release fixtures
        run: '"$FC_TEST_PYTHON" scripts/ci_release_fixtures.py prepare --output "$RUNNER_TEMP/fc-release-fixtures" --go "$(command -v go)"'
      - name: Protocol, crash recovery, arbiter and packaging regression
        run: '"$FC_TEST_PYTHON" scripts/ci_release_fixtures.py run --fixtures "$RUNNER_TEMP/fc-release-fixtures" --go "$(command -v go)" --nginx /usr/sbin/nginx -- "$FC_TEST_PYTHON" -m pytest -q'
      - name: System GTK dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo python3-venv gir1.2-gtk-4.0 gir1.2-adw-1 libqrencode4 libzbar0 python3-cryptography xvfb dbus-x11
      - name: Render and interaction regression
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 2560x2160x24' "$FC_TEST_PYTHON" clients/desktop/layout_check.py
          dbus-run-session -- xvfb-run -a "$FC_TEST_PYTHON" clients/desktop/recovery_check.py
          dbus-run-session -- xvfb-run -a "$FC_TEST_PYTHON" clients/desktop/tcp_install_check.py
      - name: Build paired preview and legacy six-file archive
        run: |
          "$FC_TEST_PYTHON" scripts/package_control.py
          "$FC_TEST_PYTHON" scripts/package_desktop.py
          mkdir -p /tmp/fc-preview-extracted
          tar -xzf artifacts/control/*.tar.gz -C /tmp/fc-preview-extracted
          /usr/bin/python3 -m venv --system-site-packages /tmp/fc-preview-env
          /tmp/fc-preview-env/bin/pip install -r /tmp/fc-preview-extracted/FamilyConnect-Control-preview/provisioning/requirements.lock
      - name: Run extracted artifacts outside checkout
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          cd /tmp
          /tmp/fc-preview-env/bin/python fc-preview-extracted/FamilyConnect-Control-preview/scripts/run_control_preview.py control --help
          dbus-run-session -- xvfb-run -a /tmp/fc-preview-env/bin/python fc-preview-extracted/FamilyConnect-Control-preview/scripts/run_control_preview.py gui --smoke
      - name: Extracted GTK recovery and public bundle digest
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          mkdir -p /tmp/fc-preview-harness
          cp clients/desktop/recovery_check.py clients/desktop/layout_check.py clients/desktop/friends_ui_check.py /tmp/fc-preview-harness/
          cd /tmp
          PYTHONPATH=/tmp/fc-preview-extracted/FamilyConnect-Control-preview/clients/desktop dbus-run-session -- xvfb-run -a /usr/bin/python3 fc-preview-harness/recovery_check.py
          PYTHONPATH=/tmp/fc-preview-extracted/FamilyConnect-Control-preview:/tmp/fc-preview-extracted/FamilyConnect-Control-preview/clients/desktop dbus-run-session -- xvfb-run -a /tmp/fc-preview-env/bin/python fc-preview-harness/friends_ui_check.py
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          artifact, = Path('artifacts/control').glob('*.tar.gz')
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          print(f'::notice title=Control preview SHA256::{artifact.name} {digest}')
          vectors = Path('tests/vectors/control-v1/manifest.json')
          print(f'::notice title=Control vectors manifest SHA256::{hashlib.sha256(vectors.read_bytes()).hexdigest()}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: linux-control-preview
          path: |
            artifacts/control/*.tar.gz
            artifacts/clients/FamilyConnect-Linux-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: control-conformance-v1-TEST-ONLY
          path: tests/vectors/control-v1/
          if-no-files-found: error
