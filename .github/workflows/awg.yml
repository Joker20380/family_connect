name: AmneziaWG pilot
on:
  pull_request:
    paths: ['pilot/awg/**', 'pilot/awg31/**', 'clients/linux/**', 'clients/desktop/backend.py', 'clients/desktop/profile_config.py', 'clients/desktop/tests/**', 'scripts/test_awg_gateway.py', 'scripts/ci_desktop_env.sh', 'control/requirements.lock', 'provisioning/requirements.lock', 'device_identity/requirements.lock', 'messenger/requirements.lock', 'compose.awg.yaml', '.github/workflows/awg.yml']
  push:
    paths: ['pilot/awg/**', 'pilot/awg31/**', 'clients/linux/**', 'clients/desktop/backend.py', 'clients/desktop/profile_config.py', 'clients/desktop/tests/**', 'scripts/test_awg_gateway.py', 'scripts/ci_desktop_env.sh', 'control/requirements.lock', 'provisioning/requirements.lock', 'device_identity/requirements.lock', 'messenger/requirements.lock', 'compose.awg.yaml', '.github/workflows/awg.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  awg:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python 3.12 and verify real desktop imports
        run: bash scripts/ci_desktop_env.sh "$RUNNER_TEMP/fc-desktop-env"
      - name: Targeted desktop dependency regressions
        run: '"$RUNNER_TEMP/fc-desktop-env/bin/python" -m pytest -q clients/desktop/tests/test_chat_host_registration.py clients/desktop/tests/test_mesh_chat_host.py clients/desktop/tests/test_support_service.py clients/desktop/tests/test_chat_service.py -rs'
      - name: Mandatory desktop pytest
        run: '"$RUNNER_TEMP/fc-desktop-env/bin/python" -m pytest -q clients/desktop/tests -rs'
      - run: docker build -f pilot/awg/Dockerfile -t family-connect-amneziawg:2-pilot1 .
      - run: '"$RUNNER_TEMP/fc-desktop-env/bin/python" -m scripts.test_awg_gateway'
      - run: docker build -f pilot/awg31/Dockerfile -t family-connect-amneziawg:3.1-desktop .
      - run: '"$RUNNER_TEMP/fc-desktop-env/bin/python" -m scripts.test_awg_gateway'
        env:
          FC_AWG_TEST_IMAGE: family-connect-amneziawg:3.1-desktop
          FC_AWG_TEST_PROTOCOL: '3.1'
