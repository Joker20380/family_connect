<form class="filters panel" method="get"><p><label for="query">Устройство или технические сведения</label><input id="query" name="q" maxlength="128" value="{{ query }}" placeholder="Найти устройство"></p><p><label for="state">Подписка</label><select id="state" name="state"><option value="">Все состояния</option>{% for value,label in state_options.items %}<option value="{{ value }}" {% if selected_state == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></p><p><label for="problem">Внимание</label><select id="problem" name="problem"><option value="">Все устройства</option><option value="1" {% if request.GET.problem == '1' %}selected{% endif %}>Только с проблемой</option></select></p><p><label for="meta-model">Модель</label><input id="meta-model" name="model" maxlength="128" value="{{ request.GET.model }}"></p><p><label for="meta-android">Android</label><input id="meta-android" name="android" maxlength="128" value="{{ request.GET.android }}"></p><p><label for="meta-app">Версия приложения</label><input id="meta-app" name="app" maxlength="128" value="{{ request.GET.app }}"></p><p><label for="meta-network">Связь</label><input id="meta-network" name="network" maxlength="128" value="{{ request.GET.network }}"></p><p><label for="meta-operator">Оператор</label><input id="meta-operator" name="operator" maxlength="128" value="{{ request.GET.operator }}"></p><p><label for="meta-transport">Фактический VPN</label><input id="meta-transport" name="transport" maxlength="128" value="{{ request.GET.transport }}"></p><p><label for="meta-city">Город по IP · приблизительно</label><input id="meta-city" name="city" maxlength="128" value="{{ request.GET.city }}"></p><button class="button" type="submit">Показать</button><a href="{{ request.path }}">Сбросить</a></form>
