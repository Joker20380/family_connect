<form class="filters panel" method="get"><p><label for="query">Название или псевдоним</label><input id="query" name="q" maxlength="128" value="{{ query }}" placeholder="Найти устройство"></p><p><label for="state">Подписка</label><select id="state" name="state"><option value="">Все состояния</option>{% for value,label in state_options.items %}<option value="{{ value }}" {% if selected_state == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></p><p><label for="problem">Внимание</label><select id="problem" name="problem"><option value="">Все устройства</option><option value="1" {% if request.GET.problem == '1' %}selected{% endif %}>Только с проблемой</option></select></p><button class="button" type="submit">Показать</button><a href="{{ request.path }}">Сбросить</a></form>
