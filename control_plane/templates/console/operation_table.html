<div class="table-scroll"><table><thead><tr><th>Device</th><th>Action</th><th>Workflow</th><th>Created (UTC)</th></tr></thead><tbody>{% for operation in operations %}<tr><td><a href="{% url 'console:operation' operation.pk %}">{{ operation.device }}</a></td><td>{{ operation.action }}</td><td><span class="pill">{{ operation.status }}</span></td><td>{{ operation.created_at|date:'m-d H:i:s' }}</td></tr>{% empty %}<tr><td colspan="4" class="empty">No requests yet. Creating an intent never changes entitlement.</td></tr>{% endfor %}</tbody></table></div>
