name: family-connect-pilot
services:
  gateway:
    build:
      context: .
      dockerfile: pilot/Dockerfile
    image: family-connect-wireguard:pilot1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "0"
    ports: ["51820:51820/udp"]
    volumes: ["./state-v2/wireguard:/keys:ro"]
    mem_limit: 128m
    pids_limit: 64
