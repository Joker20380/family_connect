map $http_x_fc_probe_id $fc_probe_id {
    default "";
    "~^[a-f0-9]{32}$" $http_x_fc_probe_id;
}
map $fc_probe_id $fc_probe_log { "" 0; default 1; }
map $uri $fc_product_step {
    default "other";
    /friends/restricted-readiness/challenge "challenge";
    /friends/restricted-readiness "readiness";
}
log_format fc_probe escape=json '{"probe_id":"$fc_probe_id","timestamp":$msec,"generation":"$fc_http_generation","product_step":"$fc_product_step","status":$status,"upstream_status":"$upstream_status","upstream_connect_seconds":"$upstream_connect_time","upstream_header_seconds":"$upstream_header_time","request_limit":"$limit_req_status","connection_limit":"$limit_conn_status"}';
