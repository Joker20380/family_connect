<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#041310">
<title>Приглашение — Family Connect</title>
<style>
:root{color-scheme:dark;--bg:#041310;--panel:#082219;--text:#dafff2;--muted:#99c4b5;--on:#70f4c6;--off:#ffad46;--line:#285347}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}.app{max-width:520px;min-height:100dvh;margin:auto;padding:18px 20px 40px;background:linear-gradient(90deg,#70f4c604 1px,transparent 1px),linear-gradient(#70f4c604 1px,transparent 1px);background-size:32px 32px}.header{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:14px 16px;background:var(--bg)}.logo{width:37px;height:44px;flex:none;color:var(--on)}h1{font-size:22px;letter-spacing:.01em;font-weight:500;line-height:1.2;margin:0}.eyebrow{font-size:9px;letter-spacing:.1em;color:var(--on);margin-top:4px}.status{display:flex;align-items:center;gap:8px;margin:18px 2px 0;font-size:12px;color:var(--on)}.status[data-valid=false]{color:var(--off)}.led{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}.panel{background:var(--panel);border:1px solid var(--line);padding:20px;margin-top:18px}.cta,.alt,.open-btn{display:block;text-align:center;padding:15px 14px;border:1px solid var(--on);text-decoration:none;background:#70f4c60a;color:var(--on);font-weight:600;font-size:16px;margin-top:10px}.cta:active,.alt:active,.open-btn:active{transform:scale(.985)}.alt{border-color:var(--line);color:var(--text);font-size:15px}.open-btn{background:transparent;font-size:15px}.version{color:var(--muted);font-size:12px;margin:10px 0 0;text-align:center}.q{display:block;color:var(--muted);font-size:13px;margin:16px 0 0;text-align:center}.others{color:var(--muted);font-size:13px;margin:16px 0 0;line-height:2}.others a{color:var(--on);text-decoration:none;border-bottom:1px solid var(--line);padding:0 2px}.subhead{display:block;color:var(--text);font-size:16px;font-weight:600;text-align:center;margin-top:2px}.platforms{display:flex;flex-direction:column}.hint{color:var(--muted);font-size:12px;margin:14px 0 0}.footer{font-size:11px;text-align:center;margin:24px 0;color:var(--muted)}
.pcard{margin-top:14px;line-height:1.5}.pname{display:block;color:var(--text);font-weight:600;font-size:14px}.others .mini{display:block;color:var(--on);font-size:13px;text-decoration:none;border-bottom:1px solid var(--line);padding:2px 0;margin-top:4px}.note{display:block;color:var(--muted);font-size:12px;margin-top:8px}
</style>
<main class="app">
<header class="header"><svg class="logo" viewBox="0 0 40 48" aria-hidden="true"><path d="M20 2 37 12v24L20 46 3 36V12Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="m12 34 8 5V10l-8 5Z" fill="currentColor"/><path d="M27 17v12" stroke="currentColor" stroke-width="3"/></svg><div><h1>Family Connect</h1><div class="eyebrow">SECURE NETWORK TERMINAL</div></div></header>
<div id="invitation-status" class="status" role="status"><span class="led"></span><span id="invitation-label">Проверяем приглашение</span></div>
<section class="panel">
<p id="title" class="hint" style="margin-top:0">Чтобы получить доступ, установите Family Connect на это устройство.</p>
<a id="primary" class="cta" href="#">Скачать Family Connect</a>
<p id="version" class="version" hidden></p>
<div id="open" hidden><span class="q">Уже установили Family Connect?</span><a id="open-link" class="open-btn" href="#">Открыть Family Connect</a></div>
<div id="primary-options" class="others" hidden></div>
<div id="others" class="others" hidden></div>
<p id="hint" class="hint"></p>
</section>
<div class="footer">Отправьте эту ссылку человеку, которого хотите подключить.</div>
</main>
<script>
const token=location.hash.slice(1),valid=/^[a-f0-9]{64}$/.test(token),byId=id=>document.getElementById(id);
const P={
 android:{name:'Android',version:'Beta51 · Android 8.0+ · ARM64',primary:{label:'Скачать для Android',url:'/downloads/FamilyConnect-Test-0.1.18-beta51.apk'},variants:[]},
 windows:{name:'Windows',version:'0.2.15 · Windows 10 1809+ / 11 · x64',primary:{label:'Скачать для Windows',url:'/downloads/FamilyConnect-Setup-0.2.15-pilot-unsigned.exe'},variants:[{note:'Проблемы с установкой на старой Windows 10?',label:'Скачать совместимую версию 0.2.14',url:'/downloads/FamilyConnect-Setup-0.2.14-pilot-unsigned.exe'}]},
 linux:{name:'Linux',version:'AppImage · 0.2.11 · x86_64',primary:{label:'Скачать AppImage',url:'/downloads/FamilyConnect-0.2.11-x86_64.AppImage'},variants:[{label:'Скачать .deb (Ubuntu / Debian / Mint)',url:'/downloads/FamilyConnect_0.2.11_amd64.deb'},{label:'Для опытных пользователей — .tar.gz',url:'/downloads/FamilyConnect-Control-Linux-preview-5b02e8cb9fde119f.tar.gz'}]}
};
const order=['android','windows','linux'],ua=navigator.userAgent;
const platform=/Android/i.test(ua)?'android':/Windows/i.test(ua)?'windows':/Linux/i.test(ua)?'linux':'';
function variant(v){return (v.note?'<span class="note">'+v.note+'</span>':'')+'<a class="mini" href="'+v.url+'">'+v.label+'</a>';}
function card(k){const c=P[k];return '<div class="pcard"><span class="pname">'+c.name+'</span><a class="mini" href="'+c.primary.url+'">'+c.primary.label+'</a>'+c.variants.map(variant).join('')+'</div>';}
function render(){
 byId('invitation-status').dataset.valid=String(valid);
 byId('invitation-label').textContent=valid?'Приглашение готово':'Нужна ссылка приглашения';
 byId('hint').textContent=valid?'':'Откройте полную ссылку приглашения, которую вам прислали.';
 const primary=byId('primary'),version=byId('version'),open=byId('open'),others=byId('others'),options=byId('primary-options');
 if(platform){
  const c=P[platform];
  primary.hidden=false;version.hidden=false;
  primary.textContent=c.primary.label;primary.href=c.primary.url;version.textContent=c.version;
  const canOpen=(platform==='android'||platform==='windows')&&valid;
  open.hidden=!canOpen;if(canOpen)byId('open-link').href='familyconnect://invite/'+token;
  options.hidden=c.variants.length===0;options.innerHTML=c.variants.map(variant).join('');
  others.hidden=false;others.innerHTML='<span class="subhead">Другие платформы</span>'+order.filter(k=>k!==platform).map(card).join('');
 }else{
  primary.hidden=true;version.hidden=true;open.hidden=true;options.hidden=true;
  others.hidden=false;others.innerHTML='<span class="subhead">Скачать Family Connect</span>'+order.map(card).join('');
 }
}
render();
</script>
</html>
