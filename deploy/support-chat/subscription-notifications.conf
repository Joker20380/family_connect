[Service]
ExecStart=
ExecStart=/opt/family-connect-support/venv/bin/python -m provisioning.support_worker --store /var/lib/family-connect-support/history --key /etc/family-connect-support/store.key --sender-public ${SUPPORT_SENDER_PUBLIC} --snapshot /var/lib/fc-support-bindings/current.json --runtime /var/lib/family-connect-support/rns --socket /run/family-connect-support/worker.sock --snapshot-uid 0 --subscription-feed /var/lib/fc-support-bindings/subscriptions.json
